name: Collect Air Quality Reading

on:
  schedule:
    # Every 3 hours (8x per day)
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect reading
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: python collect_20260501.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Check collection status
        run: |
          if [ ! -f data/readings.json ]; then
            echo "Warning: readings.json not created" >&2
            exit 0
          fi

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/readings.json
          git diff --cached --quiet || git commit -m "data: add reading $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
        if: always()
